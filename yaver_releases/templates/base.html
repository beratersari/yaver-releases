<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: only dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07090d">
  <meta name="color-scheme" content="only dark">
  <title>{% block title %}Yaver releases{% endblock %}</title>
  <script>
    (function () {
      var theme = "dark";
      try {
        if (localStorage.getItem("yaver.theme") === "light") theme = "light";
      } catch (err) {}
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      var scheme = theme === "light" ? "only light" : "only dark";
      root.style.setProperty("color-scheme", scheme);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.setAttribute("content", scheme);
      var paint = document.querySelector('meta[name="theme-color"]');
      if (paint) paint.setAttribute("content", theme === "light" ? "#f3f6f4" : "#07090d");
    })();
  </script>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  {% set path = request.url.path %}
  <div class="app">
    <aside class="side">
      <div class="brand">
        <button type="button" class="theme" id="theme" role="switch" aria-checked="true" aria-label="Switch to light theme" title="Light theme">
          <svg class="moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M9.1 1.8a5.4 5.4 0 1 0 5.1 7.2A4.5 4.5 0 1 1 9.1 1.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <svg class="sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1.7v1.5M8 12.8v1.5M1.7 8h1.5M12.8 8h1.5M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <a class="brand-link" href="/install">
          <span class="mark"><img src="/static/yaver-wink.gif" alt="" width="64" height="64"></span>
          <span>
            <span class="brand-name">Yaver</span>
          </span>
        </a>
      </div>
      <nav aria-label="Primary">
        <a href="/install" class="{% if path == '/' or path == '/install' %}active{% endif %}" {% if path == '/' or path == '/install' %}aria-current="page"{% endif %}>
          <span class="idx">01</span>
          <span>Install</span>
        </a>
        <a href="/releases" class="{% if path == '/releases' %}active{% endif %}" {% if path == '/releases' %}aria-current="page"{% endif %}>
          <span class="idx">02</span>
          <span>Release history</span>
        </a>
        <a href="/dependencies" class="{% if path == '/dependencies' %}active{% endif %}" {% if path == '/dependencies' %}aria-current="page"{% endif %}>
          <span class="idx">03</span>
          <span>Dependencies</span>
        </a>
        {% if show_analytics_nav %}
        <a href="/admin/analytics" class="{% if path.startswith('/admin/analytics') %}active{% endif %}" {% if path.startswith('/admin/analytics') %}aria-current="page"{% endif %}>
          <span class="idx">04</span>
          <span>Analytics</span>
        </a>
        {% endif %}
      </nav>
      <p class="side-foot">Downloads stay open on this network.</p>
    </aside>
    <main>
      <div class="page">
        {% block body %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="/static/theme.js"></script>
</body>
</html>
